# Two increments of the visits counter at the same moment.
# Start the app first: node victims/counter/main.ts   (add --fixed for the fixed version)
# then: npm run interleave -- run victims/counter/scenario.yaml
name: counter-lost-increment
app:
  base_url: http://127.0.0.1:8088
database:
  admin_dsn: postgres://interleave:interleave@127.0.0.1:5432/interleave?sslmode=disable
  reset: seed.sql
requests:
  - method: POST
    path: /increment
    body: {counter: visits}
  - method: POST
    path: /increment
    body: {counter: visits}
invariants:
  - name: no increment lost
    sql: SELECT n = (SELECT count(*) FROM increments WHERE counter = 'visits') FROM counters WHERE name = 'visits'
# The serial oracle (D-031): a run's outcome (these columns, plus each request's
# HTTP status) must equal what some one-at-a-time order gives. Serial ids are
# left out: a correct run may hand them out in another order.
serial:
  counters: [name, n]
  increments: [counter]
