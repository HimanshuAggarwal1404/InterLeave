# Two people sign up with the same username at the same moment.
# Start the app first: node victims/username/main.ts   (add --fixed for the fixed version)
# then: npm run interleave -- run victims/username/scenario.yaml
name: username-duplicate-signup
app:
  base_url: http://127.0.0.1:8085
database:
  admin_dsn: postgres://interleave:interleave@127.0.0.1:5432/interleave?sslmode=disable
  reset: seed.sql
requests:
  - method: POST
    path: /signup
    body: {username: himanshu}
  - method: POST
    path: /signup
    body: {username: himanshu}
invariants:
  - name: usernames are unique
    sql: SELECT count(*) = count(DISTINCT username) FROM members
# The serial oracle (D-031): a run's outcome (these columns, plus each request's
# HTTP status) must equal what some one-at-a-time order gives. Serial ids are
# left out: a correct run may hand them out in another order.
serial:
  members: [username]
