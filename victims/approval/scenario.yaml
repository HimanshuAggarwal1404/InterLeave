# Two managers approve the same pending request at the same moment.
# Start the app first: node victims/approval/main.ts   (add --fixed for the fixed version)
# then: npm run interleave -- run victims/approval/scenario.yaml
name: approval-double-approve
app:
  base_url: http://127.0.0.1:8087
database:
  admin_dsn: postgres://interleave:interleave@127.0.0.1:5432/interleave?sslmode=disable
  reset: seed.sql
requests:
  - method: POST
    path: /approve
    body: {request: 1, approver: asha}
  - method: POST
    path: /approve
    body: {request: 1, approver: ravi}
invariants:
  - name: request approved at most once
    sql: SELECT count(*) <= 1 FROM approvals WHERE request_id = 1
# The serial oracle (D-031): a run's outcome (these columns, plus each request's
# HTTP status) must equal what some one-at-a-time order gives. Serial ids are
# left out: a correct run may hand them out in another order.
serial:
  approval_requests: [id, status, version]
  approvals: [request_id, approver]
