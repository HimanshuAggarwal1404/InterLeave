services:
  db:
    image: postgres:17
    container_name: interleave-db
    environment:
      POSTGRES_USER: interleave
      POSTGRES_PASSWORD: interleave
      POSTGRES_DB: interleave
    ports:
      - "127.0.0.1:5432:5432"   # bind to localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interleave -d interleave"]
      interval: 2s
      timeout: 3s
      retries: 15
    # No volume on purpose: the database is disposable and resets on `docker compose down`.
